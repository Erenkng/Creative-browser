name: Release

# Publishes a GitHub release with the signed APK. Start it from the Actions tab
# ("Run workflow"), or push a tag that matches versionName, such as v0.2.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Work out the version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stop if this version was already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists; raise versionName first."
            exit 1
          fi

      - name: Release notes
        run: |
          NOTES="docs/releases/${{ steps.version.outputs.tag }}.md"
          [ -f "$NOTES" ] || { echo "Missing $NOTES"; exit 1; }

      - name: Unit tests
        run: ./gradlew :core:model:test --console=plain -q

      - name: Build release APK
        run: |
          ./gradlew assembleRelease --console=plain > build-release.log 2>&1 \
            || { grep -E "^e: |: error:|What went wrong|FAILED" -A 6 build-release.log | head -n 120; exit 1; }
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Oavi-${{ steps.version.outputs.version }}.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="dist/Oavi-${{ steps.version.outputs.version }}.apk"
          cp "docs/releases/${{ steps.version.outputs.tag }}.md" notes.md
          printf '\n---\n\nSHA-256: `%s`\n' "$(sha256sum "$APK" | cut -d' ' -f1)" >> notes.md
          TARGET=()
          [ "$GITHUB_REF_TYPE" = "tag" ] || TARGET=(--target "$GITHUB_SHA")
          gh release create "${{ steps.version.outputs.tag }}" "$APK" \
            --title "Oavi ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            "${TARGET[@]}"
          echo "Published ${{ steps.version.outputs.tag }}"
