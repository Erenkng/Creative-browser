name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # A newer push waits for the run in progress instead of cancelling it.
  cancel-in-progress: false

permissions:
  contents: read

# Gradle output is written to log files and only the relevant lines are printed, so a
# failure can be read at a glance.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Page-tools extension tests
        working-directory: tools/extension-test
        run: npm install --silent && npm test

      - name: Unit tests
        run: |
          ./gradlew :core:model:test --console=plain > unit-tests.log 2>&1 \
            || { grep -E "FAILED|AssertionError|What went wrong" -A 6 unit-tests.log | head -n 80; exit 1; }
          echo "unit tests passed"

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --console=plain > build-debug.log 2>&1 \
            || { grep -E "^e: |: error:|What went wrong|FAILED" -A 6 build-debug.log | head -n 120; exit 1; }
          ls -la app/build/outputs/apk/debug/*.apk

      - name: Build release APK
        run: |
          ./gradlew assembleRelease --console=plain > build-release.log 2>&1 \
            || { grep -E "^e: |: error:|What went wrong|FAILED|Missing class|R8" -A 6 build-release.log | head -n 120; exit 1; }
          ls -la app/build/outputs/apk/release/*.apk

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: oavi-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Last, so its findings are the final thing in the log.
      - name: Lint
        if: always()
        run: |
          ./gradlew lintDebug --console=plain > lint.log 2>&1 && { echo "lint passed"; exit 0; }
          grep -E "Lint found" lint.log | sort -u | head -n 12
          find . -path "*lint_intermediate_text_report*" -name "*.txt" -exec grep -h "Error:" {} + | sed "s#$PWD/##" | sort -u | head -n 60
          exit 1

  smoke:
    name: Smoke test on an Android 17 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # The same optimised build people install, plus x86_64 so the emulator can run it.
      - name: Build release APK for the emulator
        run: |
          ./gradlew assembleRelease -Poavi.extraAbi=x86_64 --console=plain > build-release.log 2>&1 \
            || { grep -E "^e: |: error:|What went wrong|FAILED" -A 6 build-release.log | head -n 120; exit 1; }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test
        env:
          SMOKE_SCREENSHOTS: ${{ contains(github.event.head_commit.message, '[screenshots]') && '1' || '0' }}
        run: bash tools/ci-emulator.sh app/build/outputs/apk/release/app-release.apk com.oavi.browser

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshots
          path: shots/*.png
          if-no-files-found: ignore
