name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests
        run: ./gradlew :core:model:test --console=plain

      - name: Engine version
        if: always()
        run: ./gradlew :core:engine:dependencyInsight --configuration debugCompileClasspath --dependency geckoview --console=plain | grep -m 5 -i geckoview || true

      - name: Build debug APK
        if: always()
        run: ./gradlew assembleDebug --console=plain

      - name: Build release APK
        if: always()
        run: ./gradlew assembleRelease --console=plain

      - name: Lint
        if: always()
        run: ./gradlew lintDebug --console=plain

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: oavi-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  smoke:
    name: Smoke test on an Android 17 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain -q

      - name: Available Android 17 system images
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null | grep -E "system-images;android-3[7-9]" | cut -d"|" -f1 | sort -u | head -n 30 || true'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: false
          script: bash tools/smoke-test.sh

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshot
          path: smoke-screenshot.png
          if-no-files-found: ignore
