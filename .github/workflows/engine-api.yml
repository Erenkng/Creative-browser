name: Engine API

# Prints the public API of the GeckoView version the app is built against, so code can be
# written against the real signatures. Run it from the Actions tab; it builds nothing.
on:
  workflow_dispatch:
    inputs:
      classes:
        description: Space-separated class names under org.mozilla.geckoview (empty for the usual set)
        required: false
        default: ""

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Download the engine
        run: |
          version=$(sed -n 's/^geckoview = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          echo "GeckoView $version"
          base=https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/$version
          curl -sSfL -o geckoview.aar "$base/geckoview-$version.aar"
          unzip -q -o geckoview.aar classes.jar
      - name: Print the API
        env:
          CLASSES: ${{ inputs.classes }}
        run: |
          set -- $CLASSES
          if [ $# -eq 0 ]; then
            set -- GeckoRuntimeSettings 'GeckoRuntimeSettings$Builder' GeckoSession \
              BasicSelectionActionDelegate 'GeckoSession$SelectionActionDelegate' \
              'GeckoSession$SelectionActionDelegate$Selection' 'ContentBlocking$Settings' \
              'ContentBlocking$Settings$Builder' 'ContentBlocking$CookieBannerMode' \
              TranslationsController 'TranslationsController$SessionTranslation' \
              'TranslationsController$RuntimeTranslation' GeckoWebExecutor WebRequest \
              'WebRequest$Builder' StorageController 'GeckoSession$PrintDelegate' \
              'GeckoSession$ContentDelegate' 'GeckoSession$NavigationDelegate'
          fi
          for name in "$@"; do
            echo "::group::$name"
            javap -protected -classpath classes.jar "org.mozilla.geckoview.$name" || true
            echo "::endgroup::"
          done
